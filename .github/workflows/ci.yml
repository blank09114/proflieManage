name: Checks

on:
    push:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: checks-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - name: Browser regressions
              run: npm run test:editor:browser
            - name: Production security headers
              run: npm run test:security:browser
